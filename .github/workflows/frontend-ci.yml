name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Run JS actions on Node 24 (covers the github-script action bundled inside
# codecov-action, which still ships a Node 20 runtime).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: type-check · unit tests · coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (static analysis)
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm exec vitest run --coverage

      - name: DB integration tests + coverage (seeded demo data)
        run: pnpm exec vitest run --config vitest.integration.config.ts --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: football-betting/frontend
          flags: frontend
          files: ./coverage/lcov.info,./coverage-integration/lcov.info
          fail_ci_if_error: false

  e2e:
    name: e2e (playwright, full stack)
    # Only spend E2E minutes once the cheap checks (type-check + unit +
    # integration) are green.
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      # Recreate the local sibling layout the Playwright config expects:
      #   <root>/frontend, <root>/betting-api, <root>/shared/db/test.db
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          path: frontend

      - name: Checkout betting-api
        uses: actions/checkout@v6
        with:
          repository: football-betting/betting-api
          path: betting-api

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache betting-api build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: betting-api

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # Prebuild so the Playwright `cargo run` webServer launches within its
      # start timeout instead of compiling from scratch on first request.
      - name: Prebuild betting-api
        working-directory: betting-api
        run: cargo build

      # better-sqlite3 / rusqlite create the DB file but not its directory.
      - name: Create shared DB directory
        run: mkdir -p shared/db

      - name: Run Playwright E2E
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
