    <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-wc-red/10 rounded-full blur-[100px] z-10"></div>

<!-- Main Login Container -->
<main class="relative z-20 w-full max-w-[440px] px-margin-mobile md:px-0">
    <!-- Brand Header (Floating above card) -->
    <div class="text-center mb-stack-lg">
        <h1 class="font-display-lg text-headline-md font-extrabold text-wc-red tracking-tighter">
            WC2026 PREDICTOR
        </h1>
    </div>
    <!-- Glassmorphism Login Card -->
    <div class="glass-panel rounded-xl p-8 shadow-2xl flex flex-col gap-stack-md">
        <header class="text-center mb-stack-sm">
            <h2 class="font-headline-lg text-headline-lg text-on-surface">Welcome to WC2026</h2>
            <p class="font-body-md text-on-surface-variant mt-2">Sign in to start your journey.</p>
        </header>
        <!-- Social Login Cluster -->
        <div class="grid grid-cols-2 gap-stack-sm mb-stack-xs">
            <button class="flex items-center justify-center gap-stack-sm py-3 px-4 rounded-lg border border-border-subtle bg-surface-variant/30 hover:bg-surface-variant/50 transition-all duration-200 btn-hover-effect">

                <span class="font-label-sm text-label-sm uppercase tracking-wider">Google</span>
            </button>
            <button class="flex items-center justify-center gap-stack-sm py-3 px-4 rounded-lg border border-border-subtle bg-surface-variant/30 hover:bg-surface-variant/50 transition-all duration-200 btn-hover-effect">
                <span class="material-symbols-outlined text-[20px]">ios</span>
                <span class="font-label-sm text-label-sm uppercase tracking-wider">Apple</span>
            </button>
        </div>
        <div class="relative flex items-center py-stack-sm">
            <div class="flex-grow border-t border-border-subtle"></div>
            <span class="flex-shrink mx-4 font-label-xs text-label-xs text-on-surface-variant uppercase">Or with Email</span>
            <div class="flex-grow border-t border-border-subtle"></div>
        </div>
        <!-- Login Form -->
        <form class="flex flex-col gap-stack-md">
            <div class="space-y-stack-xs">
                <label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">Email Address</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
                    <input class="w-full bg-primary-container border border-border-subtle rounded-lg py-4 pl-12 pr-4 text-on-surface focus:outline-none focus:border-electric-blue transition-colors placeholder:text-outline-variant" id="email" placeholder="name@example.com" type="email"/>
                </div>
            </div>
            <div class="space-y-stack-xs">

                    <label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>

                </div>

                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>
            <button class="w-full bg-wc-red hover:bg-wc-red/90 text-on-primary py-4 rounded-lg font-headline-md text-headline-md font-bold transition-all btn-hover-effect mt-stack-sm shadow-lg shadow-wc-red/20" type="submit">
                Login
            </button>

                Don't have an account?

            </p>

<!-- Decorative Corner Gradients -->
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-wc-red via-live-cyan to-wc-red opacity-50 z-50"></div>
<script>
    // Simple micro-interaction for visual feedback
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('mousedown', () => {
            button.style.transform = 'scale(0.98)';
        });
        button.addEventListener('mouseup', () => {
            button.style.transform = 'scale(1)';
        });
        button.addEventListener('mouseleave', () => {
            button.style.transform = 'scale(1)';
        });
    });

    // Background subtle movement effect
    document.addEventListener('mousemove', (e) => {
        const amount = 10;
        const x = (e.clientX / window.innerWidth - 0.5) * amount;
        const y = (e.clientY / window.innerHeight - 0.5) * amount;
        const hero = document.querySelector('.absolute.inset-0.z-0 img');
        if(hero) {
            hero.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        }
    });
</script>
