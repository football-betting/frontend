    <style>
        body {
            background-color: #0a0a0a;
            color: #e3e2e7;
            -webkit-font-smoothing: antialiased;
        }
        .stadium-bg {
            background:
                    linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.95)),
                    url('image-stadium-aerial');
            background-size: cover;
            background-position: center;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="min-h-screen flex items-center justify-center stadium-bg p-margin-mobile md:p-0">
<!-- Background Image with prompt as required -->
<div class="fixed inset-0 -z-10 bg-black overflow-hidden">
    <img class="w-full h-full object-cover opacity-30 grayscale brightness-50" data-alt="A cinematic aerial view of a massive football stadium at night under heavy floodlights. The scene is dominated by deep blacks and cool grays, creating a high-stakes professional broadcast atmosphere. Sharp rays of light pierce through a light mist over the pitch, emphasizing a dramatic and authoritative sports environment. The overall mood is cold, precise, and intense, mirroring a premium high-contrast dark mode UI." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBEINiMZwPA4GO5c5WWZENMMZPFRUFbJL9xLX6jKl5eSogHE-ffRd7eJT6wdRoXyBKE4OvnARn6A8tsoqWTSwPxHvRPgGwO6cHCZmf2Tx-GcwkAz9e--fg2nwOWDG-CyaUQvcwO_fCv-I3DmW2V8A1DfAvGR2lwGU3yzO5S-UBD42JPwSmRSGrCwwLMJI0NDE4SnF69R9aVID0B5tjrNWCWCla2lRlxNl_vNLAOFomGPmBXWkYAU5kTjcEv-iV-ojFPHR59VL4jet-"/>
</div>
<!-- Login Container -->
<main class="w-full max-w-[440px] z-10">
    <!-- Brand Header (Based on TopAppBar style_brand_logo) -->
    <div class="mb-lg text-center">
        <h1 class="text-headline-lg font-headline-lg font-black text-on-background tracking-tighter uppercase">
            TOURNAMENT PREDICTOR
        </h1>
        <p class="text-on-surface-variant font-body-sm text-body-sm mt-xs opacity-60">
            PRO-GRADE ANALYTICS &amp; FORECASTING
        </p>
    </div>
    <!-- Auth Card -->
    <div class="bg-surface-container border border-outline-variant p-xl shadow-2xl">
        <form action="#" class="space-y-lg">
            <!-- Email Field -->
            <div class="space-y-xs">
                <label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="email">
                    Email Address
                </label>
                <div class="relative">
                    <input class="w-full bg-surface-container-low border border-outline-variant focus:border-primary px-md py-md text-on-surface font-body-lg text-body-lg outline-none transition-all placeholder:text-surface-container-highest" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
                </div>
            </div>
            <!-- Password Field -->
            <div class="space-y-xs">
                <div class="flex justify-between items-end">
                    <label class="text-label-caps font-label-caps text-on-surface-variant uppercase" for="password">
                        Password
                    </label>
                </div>
                <div class="relative">
                    <input class="w-full bg-surface-container-low border border-outline-variant focus:border-primary px-md py-md text-on-surface font-body-lg text-body-lg outline-none transition-all placeholder:text-surface-container-highest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                </div>
            </div>
            <!-- Primary Action -->
            <div class="pt-md">
                <button class="w-full bg-[#ff3b30] text-white font-headline-md text-headline-md py-md hover:bg-[#d32f2f] active:scale-[0.98] transition-all duration-100 font-bold uppercase tracking-tight" type="submit">
                    Sign In
                </button>
            </div>
            <!-- Secondary Action -->
            <div class="text-center pt-md">
                <a class="text-secondary font-label-caps text-label-caps uppercase hover:text-tertiary transition-colors border-b border-transparent hover:border-tertiary pb-1" href="#">
                    Create an account
                </a>
            </div>
        </form>
    </div>
    <!-- Footer Meta -->
    <div class="mt-xl text-center">
        <p class="text-on-surface-variant font-data-mono text-data-mono opacity-40 uppercase">
            © 2024 TOURNAMENT PREDICTOR / DATA SECURED
        </p>
    </div>
</main>
<!-- Micro-interaction for inputs -->
<script>
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.parentElement.querySelector('label').style.color = 'var(--primary)';
        });
        input.addEventListener('blur', () => {
            input.parentElement.parentElement.querySelector('label').style.color = '';
        });
    });

    // Atmospheric parallax tilt effect for the card
    const card = document.querySelector('.bg-surface-container');
    document.addEventListener('mousemove', (e) => {
        if (window.innerWidth < 768) return;
        const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Reset tilt on mouse out
    document.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
</script>
</body></html>
